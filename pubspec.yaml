name: babytracker
description: Aplicație pentru tracking activități bebeluș cu AI chat integrat
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  
  # AI Integration
  google_generative_ai: ^0.2.0
  
  # State Management
  provider: ^6.1.1
  
  # UI Components
  fl_chart: ^0.66.0
  
  # Utils
  intl: ^0.18.1
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
